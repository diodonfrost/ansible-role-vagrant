---
# tasks file for install Vagrant on Windows system

- name: Windows | Find all versions of Vagrant
  ansible.windows.win_uri:
    url: https://releases.hashicorp.com/vagrant/index.json
    return_content: true
  register: vagrant_index
  check_mode: false
  when: vagrant_version == 'latest'

- name: Windows | Finds the latest version of Vagrant when latest var is define
  ansible.builtin.set_fact:
    _vagrant_version: "{{ (vagrant_index.content | from_json).versions | list | sort_versions | last }}"
  when: vagrant_version == 'latest'

- name: Windows | Use the specified Vagrant version when latest var is not define
  ansible.builtin.set_fact:
    _vagrant_version: "{{ vagrant_version }}"
  when: vagrant_version != 'latest'

- name: Windows | Download vagrant
  ansible.windows.win_get_url:
    url: "{{ vagrant_pkg_url }}"
    dest: '%TEMP%\vagrant_{{ _vagrant_version }}_windows_amd64.msi'
    checksum_url: "{{ vagrant_checksum_url if vagrant_checksum_verify else omit }}"
    checksum_algorithm: "{{ 'sha256' if vagrant_checksum_verify else omit }}"

- name: Windows | Install vagrant
  ansible.windows.win_package:
    path: '%TEMP%\vagrant_{{ _vagrant_version }}_windows_amd64.msi'
    product_id: Vagrant
    creates_path: C:\HashiCorp\Vagrant
    state: present
