---
# tasks file for install Vagrant on Linux system
- name: Linux | Install Fuse
  ansible.builtin.package:
    name: "{{ _pkg_fuse[ansible_facts['os_family']] }}"
    state: present
  when: ansible_facts['os_family'] in _pkg_fuse

- name: Linux | Find all versions of Vagrant
  ansible.builtin.uri:
    url: https://releases.hashicorp.com/vagrant/index.json
    return_content: true
  register: vagrant_index
  check_mode: false
  when: vagrant_version == 'latest'

- name: Linux | Finds the latest version of Vagrant when latest var is define
  ansible.builtin.set_fact:
    _vagrant_version: "{{ (vagrant_index.content | from_json).versions | list | sort_versions | last }}"
  when: vagrant_version == 'latest'

- name: Linux | Use the specified Vagrant version when latest var is not define
  ansible.builtin.set_fact:
    _vagrant_version: "{{ vagrant_version }}"
  when: vagrant_version != 'latest'

# This task avoids downloading Vagrant every time
- name: Linux | Check if Vagrant is present with the right version
  ansible.builtin.command: vagrant --version
  register: vagrant_installed_version
  ignore_errors: true
  changed_when: false
  failed_when: false
  environment:
    APPIMAGE_EXTRACT_AND_RUN: "1"

- name: Linux | Download Vagrant archive
  ansible.builtin.get_url:
    url: "{{ vagrant_pkg_url }}"
    dest: "/tmp/vagrant_{{ _vagrant_version }}_linux_amd64.zip"
    checksum: "{{ ('sha256:' + vagrant_checksum_url) if vagrant_checksum_verify else omit }}"
    mode: '0644'
  when: _vagrant_version not in vagrant_installed_version.stdout | default('')

- name: Linux | Install Vagrant with Hashicorp binariy package
  ansible.builtin.unarchive:
    src: "/tmp/vagrant_{{ _vagrant_version }}_linux_amd64.zip"
    dest: "{{ _vagrant_path }}"
    mode: '0755'
    remote_src: true
  when: _vagrant_version not in vagrant_installed_version.stdout | default('')
