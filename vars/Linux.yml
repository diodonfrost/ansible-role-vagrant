---
# vars file for Vagrant in Linux system
_vagrant_pkg_url: "https://releases.hashicorp.com/vagrant/{{ _vagrant_version }}/vagrant_{{ _vagrant_version }}_linux_amd64.zip"

_vagrant_path: /usr/bin/

_pkg_fuse:
  Alpine:
    - fuse
  Archlinux:
    - fuse2
  Debian:
    - fuse
    - libfuse2
  Gentoo:
    - sys-fs/fuse
  RedHat:
    - fuse
    - fuse-libs
  Suse:
    - fuse
    - libfuse2
